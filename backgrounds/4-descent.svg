<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#120a20"/>
      <stop offset="0.5" stop-color="#1c0f33"/>
      <stop offset="1" stop-color="#07040d"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b45cff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c98cff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#b45cff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0b0ff" stop-opacity="0.8"/>
      <stop offset="0.4" stop-color="#a45cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a45cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze" cx="0.5" cy="0.85" r="0.8">
      <stop offset="0" stop-color="#5b21b6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5b21b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="softer" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="90"/>
    </filter>
  </defs>

  <rect width="2560" height="1440" fill="url(#dusk)"/>

  <!-- descending shaft of light -->
  <g filter="url(#softer)">
    <rect x="300" y="-300" width="420" height="2100" fill="url(#shaft)" transform="rotate(18 1280 720)"/>
  </g>
  <g filter="url(#soft)">
    <rect x="480" y="-200" width="130" height="1900" fill="url(#shaft)" transform="rotate(18 1280 720)" opacity="0.9"/>
  </g>

  <!-- soft orb where the shaft lands -->
  <circle cx="1050" cy="900" r="480" fill="url(#orb)" filter="url(#softer)"/>
  <circle cx="1050" cy="900" r="120" fill="#f2e0ff" opacity="0.55" filter="url(#soft)"/>

  <!-- low haze -->
  <rect width="2560" height="1440" fill="url(#haze)"/>

  <rect width="2560" height="1440" fill="url(#vignette)"/>
</svg>
